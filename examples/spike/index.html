<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SVNC Spike</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; }
      #screen { border: 1px solid #444; display: inline-block; min-width: 320px; min-height: 200px; background: #111; }
      .row { margin: 0.5rem 0; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
      input[type="text"] { min-width: 16rem; }
      label { font-size: 0.9rem; }
      #log { white-space: pre-wrap; background: #f4f4f4; padding: 0.5rem; max-height: 12rem; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>SVNC Spike</h1>
    <p>Lean self-built RFB client. Coordinates = remote desktop pixels (no scaleViewport).</p>
    <div class="row">
      <label>WS URL <input id="url" type="text" value="ws://127.0.0.1:6080/" /></label>
      <label>Password <input id="password" type="password" placeholder="(optional)" /></label>
      <button id="connect">Connect</button>
      <button id="disconnect" disabled>Disconnect</button>
    </div>
    <div class="row">
      <button id="shot" disabled>Screenshot</button>
      <label>x <input id="x" type="number" value="100" style="min-width:5rem" /></label>
      <label>y <input id="y" type="number" value="100" style="min-width:5rem" /></label>
      <button id="click" disabled>Click</button>
      <button id="dbl" disabled>Dblclick</button>
      <label>text <input id="text" type="text" value="hello" /></label>
      <button id="type" disabled>Type</button>
    </div>
    <div id="screen"></div>
    <h3>Log</h3>
    <div id="log"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
